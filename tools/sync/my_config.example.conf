# Fresh-machine template. Replace placeholders before running the menu.
# The launcher prefers project my_config.conf, then falls back to the user-profile file.
pool_host=localhost
pool_port=3306
pool_db=REPLACE_WITH_LOCAL_DATABASE
pool_user=REPLACE_WITH_LOCAL_MYSQL_USER
pool_password=REPLACE_WITH_LOCAL_MYSQL_PASSWORD
# Cloud connection is read from the local database's settings table.
# Set main_branch in sync.local.conf: true on main, false on either branch.
# Java-properties escaping applies: write \\ for a literal backslash in values.
