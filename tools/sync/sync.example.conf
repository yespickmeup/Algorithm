# Supplement to the existing my_config.conf. No credentials belong in git.
# main_branch=true on the main server, false on each branch server.
# Omit to use main_branch in my_config.conf, then settings.is_main_branch.
# main_branch=false
sync_interval=300
sync_page_size=200
sync_max_changes=100
sync_prices=false
sync_deletes=true
sync_max_deletes=10
sync_delete_percent=5
sync_duplicates=skip
sync_connect_timeout=10
sync_read_timeout=30
sync_write_timeout=30
# Optional verified TLS for remote MySQL (requires server support):
# sync_ssl_ca=C:/path/to/ca.pem

# Menu backups: autodetect installed mysqldump, write beneath .sync-state/backups.
# Use forward slashes in Java-properties paths, or escape each backslash.
# backup_mysqldump=C:/Program Files (x86)/MySQL/MySQL Server 5.5/bin/mysqldump.exe
# backup_directory=C:/PrivateBackups/SMIS
backup_timeout=3600
